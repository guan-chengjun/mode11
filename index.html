<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海盗船 3D 交互拆解 · Three.js</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js 通过 CDN importmap 引入 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="app"></div>

  <!-- 加载遮罩 -->
  <div id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loading-text">正在初始化航海场景…</p>
    </div>
  </div>

  <!-- 左侧控制面板 -->
  <aside id="panel" class="panel">
    <header class="panel-header">
      <span class="anchor-icon">⚓</span>
      <div>
        <h1>海盗船交互拆解</h1>
        <p>Pirate Ship 3D Explorer</p>
      </div>
    </header>

    <section class="control-group">
      <h2>运转动画</h2>
      <div class="row">
        <button id="btn-play" class="btn btn-primary" type="button">⏸ 暂停动画</button>
      </div>
      <div class="row slider-row">
        <label for="speed">动画速度</label>
        <span class="slider-value" id="speed-val">1.0×</span>
      </div>
      <div class="row">
        <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1" />
      </div>
    </section>

    <section class="control-group">
      <h2>渲染模式</h2>
      <label class="switch-row">
        <span>透视模式（看穿船壳）</span>
        <input id="chk-xray" type="checkbox" />
      </label>
      <label class="switch-row">
        <span>线框模式</span>
        <input id="chk-wire" type="checkbox" />
      </label>
    </section>

    <section class="control-group">
      <h2>视角</h2>
      <div class="row">
        <button id="btn-reset" class="btn" type="button">🎯 重置视角</button>
      </div>
    </section>

    <section class="control-group parts-list">
      <h2>部件导览（点击高亮）</h2>
      <ul id="parts-ul"></ul>
    </section>

    <footer class="panel-footer">
      拖拽旋转 · 滚轮缩放 · 右键平移
    </footer>
  </aside>

  <!-- 右侧部件讲解面板 -->
  <aside id="info" class="info-panel">
    <button id="info-close" class="info-close" type="button" aria-label="关闭">×</button>
    <span class="info-tag" id="info-tag">部件</span>
    <h2 id="info-title">部件名称</h2>
    <div id="info-body"></div>
  </aside>

  <!-- 底部提示与模型来源状态 -->
  <div id="hint">🖱 点击船体任意部件，查看结构与功能讲解</div>
  <div id="model-status" class="model-status">模型来源：检测中…</div>

  <script type="module" src="main.js"></script>
</body>
</html>
